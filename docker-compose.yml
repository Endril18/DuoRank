services:
  backend:
    image: duorank-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-postegre}@db:5432/${PG_DATABASE:-DuoRank}?schema=public
    ports:
      - "12110:12110"


  # Banco de dados PostgreSQL
  db:
    image: postgres:15
    container_name: duorank_db_container
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postegre}
      POSTGRES_DB: ${PG_DATABASE:-DuoRank}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

